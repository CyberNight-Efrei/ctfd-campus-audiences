name: Plugin validation

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile plugin
        run: python -m py_compile __init__.py
      - name: Validate default configuration
        run: python -m json.tool settings.json > /dev/null
